        // --- 3. 営業時間判定ロジック ---
        function isLunchTime(startStr, endStr) {
            const now = new Date();
            const day = now.getDay();
            // 平日（月〜金）かチェック (1=月, 5=金)
            if (day === 0 || day === 6) return false;

            const [sHour, sMin] = startStr.split(':').map(Number);
            const [eHour, eMin] = endStr.split(':').map(Number);
            
            const startTime = new Date().setHours(sHour, sMin, 0);
            const endTime = new Date().setHours(eHour, eMin, 0);
            const currentTime = now.getTime();

            return currentTime >= startTime && currentTime <= endTime;
        }

        // 曜日と現在時刻の表示アップデート
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        const now = new Date();
        document.getElementById('time-status').innerText = `現在: ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')} (${days[now.getDay()]})`;

        // --- 4. マップへのピン配置 ---
        lunchSpots.forEach(spot => {
            const isOpen = isLunchTime(spot.start, spot.end);
            
            // 営業中なら「青」、準備中・時間外なら「グレー」のピン
            const markerColor = isOpen ? 'bg-blue-600' : 'bg-gray-400';
            const statusBadge = isOpen 
                ? '<span class="text-xs bg-green-100 text-green-800 px-1.5 py-0.5 rounded font-bold">営業中</span>' 
                : '<span class="text-xs bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded font-bold">時間外/定休</span>';

                iconSize: [24, 24]
            });

            const popupContent = `
                <div class="p-1 font-sans">
                    <div class="flex items-center gap-2 mb-1">
                        <h3 class="font-bold text-base text-gray-900 m-0">${spot.name}</h3>
                        ${statusBadge}
                    </div>
                    <p class="text-xs text-gray-500 m-0 mb-1">ジャンル: ${spot.genre}</p>
                    <p class="text-xs text-gray-700 m-0"><b>ランチ時間:</b> ${spot.start} 〜 ${spot.end}</p>
                    <p class="text-xs text-gray-700 m-0"><b>予算:</b> ${spot.budget}</p>
                    ${spot.note ? `<p class="text-xs text-gray-600 bg-gray-50 p-1 rounded mt-1 border-l-2 border-gray-300">${spot.note}</p>` : ''}
                </div>
            `;

            L.marker([spot.lat, spot.lng], { icon: customIcon })
                .addTo(map)
                .bindPopup(popupContent);
        });
